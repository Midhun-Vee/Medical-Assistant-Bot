services:
  backend:
    build:
      context: ./medibot-backend
    ports:
      - "8000:8000"
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./medibot-backend:/app:Z

  frontend:
    build:
      context: ./medibot-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./medibot-frontend:/app:Z
      - /app/node_modules
    depends_on:
      - backend